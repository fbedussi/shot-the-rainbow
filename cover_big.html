<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover</title>
</head>

<body>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 1.6rem;
        }

        .image {
            position: fixed;
            z-index: 1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: solid 1px black;
            padding: 1rem;
            width: 800px;
            height: 500px;
            background-color: black;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;

            .unicorn {
                background-color: pink;
                padding: 1.5rem;
                border-radius: 5rem;
                position: absolute;
                font-size: 4rem;
                top: 0;
                left: 50%;
                border: solid 1px black;
                transform: translate(-10%, 18%);

                &.john {
                    background-color: white;
                    transform: scale(-1, 1) translate(90%, 18%);
                }
            }

            .heart {
                position: absolute;
                font-size: 3rem;
                top: 0;
                left: 50%;
                transform: translate(-46%, 180px);
            }   

            .title {
                position: absolute;
                max-width: 80%;
                font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                top: 300px;
                line-height: 1;
                text-transform: uppercase;
                text-align: center;
                width: 100%;
                left: 10%;
                font-size: 2rem;
                transform: scale(1.1, 1.4);
                -webkit-text-stroke: 2px white;
                font-weight: bold;
                color: grey;

                span {
                    font-family: Georgia, 'Times New Roman', Times, serif;
                    font-style: italic;
                    font-weight: 100;
                    text-transform: lowercase;
                    font-size: 1.2em;
                    letter-spacing: -3px;
                    color: ghostwhite;
                    -webkit-text-stroke: 0;
                    line-height: 1;
                    vertical-align: center;
                }
            }

            .rainbow {
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                width: 100%;
                display: flex;
                z-index: -1;

                &::before {
                    content: " ";
                    position: absolute;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 87%;
                    background-color: rgba(0,0,0,.5);
                    border-radius: 0 0 20px 20px;
                }

                >div {
                    flex: 1;
                    opacity: 1;

                    &:nth-child(1) {
                        background-color: red;
                    }

                    &:nth-child(2) {
                        background-color: orange;
                    }

                    &:nth-child(3) {
                        background-color: yellow;
                    }

                    &:nth-child(4) {
                        background-color: green;
                    }

                    &:nth-child(5) {
                        background-color: blue;
                    }

                    &:nth-child(6) {
                        background-color: violet;
                    }
                }
            }
        }
    </style>
    <div class="image">
        <div class="unicorn">🦄</div>
        <div class="unicorn john">🦄</div>
        <div class="heart">❤️</div>
        <p class="title">A tale of <span>two</span> Unicorns</p>
        <div class="rainbow">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>

</body>

</html>
